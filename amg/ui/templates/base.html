<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "AMG UI" }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0f1115; color: #e7e7e7; }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .card { background: #171a21; border: 1px solid #2a3040; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
      .muted { color: #9aa3b2; }
      a { color: #83b7ff; text-decoration: none; }
      a:hover { text-decoration: underline; }
      input, textarea, button { border-radius: 8px; border: 1px solid #343b4a; background: #11151d; color: #e7e7e7; padding: 10px; }
      button { cursor: pointer; background: #1f2a3f; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
      .thumb { width: 100%; border-radius: 8px; border: 1px solid #2a3040; }
      .ok { color: #84e39f; }
      .warn { color: #f6cf75; }
      .err { color: #f29a9a; }
      .pill { display: inline-block; border: 1px solid #364056; border-radius: 999px; padding: 2px 8px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card row" style="justify-content: space-between;">
        <div><strong>AMG UI v0</strong> <span class="muted">Run + review</span></div>
        <div class="muted">Auto-pilot OFF — manual review required</div>
      </div>
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
